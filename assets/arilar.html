<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07120e">
<title>A01 — Polen Arıları | Sıfır Atık Ormanı</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:#07120e;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif; }
  #canvasWrap { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; }

  .chip { position:fixed; top:calc(12px + env(safe-area-inset-top)); left:12px; z-index:10;
    background:rgba(0,0,0,.42); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    color:#eaf6ef; padding:8px 13px; border-radius:999px; font-size:12px; font-weight:700; letter-spacing:.02em; }
  .chip span { color:#7fe3ab; }

  .bar { position:fixed; left:0; right:0; bottom:0; z-index:10;
    display:flex; gap:8px; justify-content:center; flex-wrap:wrap;
    padding:12px 12px calc(12px + env(safe-area-inset-bottom)); pointer-events:none; }
  .bar button { pointer-events:auto; border:0; cursor:pointer;
    background:rgba(10,28,21,.72); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    color:#eaf6ef; font-size:13px; font-weight:700; padding:11px 16px; border-radius:12px;
    border:1px solid rgba(255,255,255,.12); }
  .bar button:active { transform:scale(.97); }
  .bar button.on { background:#0f7250; border-color:#1aa877; }

  #loader { position:fixed; inset:0; z-index:30; display:grid; place-items:center;
    background:radial-gradient(120% 90% at 50% 20%, #11553f, #06231a 70%); text-align:center; padding:24px; }
  #loader .box { max-width:320px; }
  #loader h1 { margin:0 0 6px; font-size:19px; color:#f4f8f5; }
  #loader p { margin:0 0 18px; font-size:13px; line-height:1.55; color:#9dbdae; }
  .track { width:220px; height:5px; margin:0 auto; border-radius:99px; background:rgba(255,255,255,.14); overflow:hidden; }
  .fill { height:100%; width:0%; background:linear-gradient(90deg,#ffd479,#63e59d); transition:width .25s ease; }
  #loadPct { display:block; margin-top:10px; font-size:11px; color:#7f9d8e; }

  #err { position:fixed; inset:0; z-index:40; display:none; place-items:center; padding:24px;
    background:rgba(6,20,15,.95); text-align:center; }
  #err .box { max-width:340px; background:#f7f2e6; color:#173229; border-radius:20px; padding:24px 20px; }
  #err h2 { margin:0 0 8px; font-size:19px; }
  #err p { margin:0 0 16px; font-size:14px; line-height:1.55; color:#41584f; }
  #err button { width:100%; min-height:46px; border:0; border-radius:12px; background:#0f7250;
    color:#fff; font-size:15px; font-weight:800; cursor:pointer; }
</style>
</head>
<body>

<div id="canvasWrap"></div>

<div class="chip">POLEN ARILARI · <span id="pct">%0</span> yeşillendi</div>

<div class="bar">
  <button id="btnRestart">↻ Yeniden Başlat</button>
  <button id="btnArt" class="on">Eser: Açık</button>
  <button id="btnCount">7 Arı</button>
</div>

<div id="loader">
  <div class="box">
    <h1>Polen Arıları hazırlanıyor</h1>
    <p>Arılar ekranın dışından gelecek, A01'in çiçeklerine konacak ve havalandıklarında polen saçacak.</p>
    <div class="track"><div class="fill" id="loadFill"></div></div>
    <span id="loadPct">başlatılıyor…</span>
  </div>
</div>

<div id="err"><div class="box">
  <h2 id="errTitle">Sahne açılamadı</h2>
  <p id="errText">Lütfen tekrar deneyin.</p>
  <button onclick="location.reload()">Tekrar Dene</button>
</div></div>

<script>
/* ===========================================================================
   A01 — POLEN ARILARI
   Bağımsız sahne. A01 WebAR akışına (index.html / app.js) HİÇ dokunmaz.

   three.js r137 UMD kullanılır: import map / ES module gerektirmez, bu yüzden
   eski iOS Safari sürümlerinde de sorunsuz açılır.
   =========================================================================== */
(function () {
  'use strict';

  var CFG = {
    threeUrls: [
      'https://cdn.jsdelivr.net/npm/three@0.137.5/build/three.min.js',
      'https://unpkg.com/three@0.137.5/build/three.min.js'
    ],
    loaderUrls: [
      'https://cdn.jsdelivr.net/npm/three@0.137.5/examples/js/loaders/GLTFLoader.js',
      'https://unpkg.com/three@0.137.5/examples/js/loaders/GLTFLoader.js'
    ],
    beeUrl: 'assets/A01_bee.glb',
    artUrl: 'assets/A01_poster.jpg',

    ART_W: 2.0,            // eser düzlemi genişliği (2:3)
    ART_H: 3.0,
    BEE_COUNTS: [7, 9, 5],
    POLLEN_MAX: 900,
    SPROUT_MAX: 260,
    GREEN_FULL: 2500       // bu kadar polen konunca %100 yeşil (~40 sn)
  };

  /* A01 master'ında tespit edilen gerçek çiçek merkezleri.
     Hough daire tespiti + doygunluk filtresi ile bulundu, elle doğrulandı.
     Değerler 1024x1536 görsele göre normalize (0..1). */
  var FLOWERS = [
    [0.3184, 0.1810], [0.5332, 0.2031], [0.7188, 0.2643], [0.2031, 0.2995],
    [0.5273, 0.3581], [0.8164, 0.3659], [0.0957, 0.4206], [0.3262, 0.4362],
    [0.6582, 0.4531], [0.9043, 0.5182], [0.1758, 0.5299], [0.4570, 0.5469],
    [0.7129, 0.5781], [0.1328, 0.6836], [0.7832, 0.6927]
  ];

  var $ = function (id) { return document.getElementById(id); };
  var THREE, renderer, scene, camera, clock;
  var artMesh, greenMesh, maskCtx, maskTex, sprouts, pollen, pollenGeo, pollenAttr;
  var beeProto = null, bees = [], pollenPool = [], sproutList = [];
  var landedCount = 0, greenProgress = 0, countIdx = 0, running = false;
  var W = CFG.ART_W, H = CFG.ART_H;

  /* --------------------------------------------------------- yükleyiciler */

  function loadScript(urls, label, cb, fail) {
    var i = 0;
    (function next() {
      if (i >= urls.length) { fail(new Error(label + ' yüklenemedi')); return; }
      var url = urls[i++], done = false;
      var s = document.createElement('script');
      s.src = url; s.async = false;
      var to = setTimeout(function () { if (!done) { done = true; s.remove(); next(); } }, 20000);
      s.onload = function () { if (!done) { done = true; clearTimeout(to); cb(); } };
      s.onerror = function () { if (!done) { done = true; clearTimeout(to); s.remove(); next(); } };
      document.head.appendChild(s);
    })();
  }

  function setProgress(p, txt) {
    $('loadFill').style.width = Math.round(p * 100) + '%';
    if (txt) $('loadPct').textContent = txt;
  }

  function fail(title, text) {
    $('errTitle').textContent = title;
    $('errText').textContent = text;
    $('err').style.display = 'grid';
    $('loader').style.display = 'none';
  }

  /* ------------------------------------------------------ prosedürel doku */

  function dotTexture() {
    var c = document.createElement('canvas'); c.width = c.height = 64;
    var g = c.getContext('2d');
    var rad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    rad.addColorStop(0.00, 'rgba(255,246,205,1)');
    rad.addColorStop(0.28, 'rgba(255,214,110,0.92)');
    rad.addColorStop(0.62, 'rgba(255,180,60,0.30)');
    rad.addColorStop(1.00, 'rgba(255,170,40,0)');
    g.fillStyle = rad; g.fillRect(0, 0, 64, 64);
    var t = new THREE.Texture(c); t.needsUpdate = true; return t;
  }

  function leafTexture() {
    var S = 128;
    var c = document.createElement('canvas'); c.width = c.height = S;
    var g = c.getContext('2d');
    g.clearRect(0, 0, S, S);
    // iki yapraklı küçük filiz
    function blade(cx, cy, w, h, rot, c1, c2) {
      g.save(); g.translate(cx, cy); g.rotate(rot);
      var lg = g.createLinearGradient(0, h / 2, 0, -h / 2);
      lg.addColorStop(0, c1); lg.addColorStop(1, c2);
      g.fillStyle = lg;
      g.beginPath();
      g.moveTo(0, h / 2);
      g.bezierCurveTo(w, h * 0.14, w * 0.62, -h * 0.30, 0, -h / 2);
      g.bezierCurveTo(-w * 0.62, -h * 0.30, -w, h * 0.14, 0, h / 2);
      g.fill();
      g.restore();
    }
    blade(S * 0.38, S * 0.60, 16, 74, -0.42, '#1f6f3d', '#7ede9a');
    blade(S * 0.62, S * 0.58, 15, 66, 0.46, '#22794a', '#8fe9a8');
    blade(S * 0.50, S * 0.55, 13, 84, 0.02, '#2b8a4f', '#b6f5c4');
    var t = new THREE.Texture(c); t.needsUpdate = true; return t;
  }

  function maskTexture() {
    var c = document.createElement('canvas'); c.width = 320; c.height = 448;
    maskCtx = c.getContext('2d');
    maskCtx.fillStyle = '#000'; maskCtx.fillRect(0, 0, c.width, c.height);
    var t = new THREE.Texture(c); t.needsUpdate = true; return t;
  }

  /* --------------------------------------------------------------- sahne  */

  function buildScene() {
    var wrap = $('canvasWrap');
    renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(wrap.clientWidth, wrap.clientHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.NoToneMapping;
    wrap.appendChild(renderer.domElement);

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x08181f);

    camera = new THREE.PerspectiveCamera(42, 1, 0.1, 60);
    scene.add(camera);

    scene.add(new THREE.AmbientLight(0xffffff, 0.72));
    scene.add(new THREE.HemisphereLight(0xcfeaff, 0x2d4b2f, 0.55));
    var key = new THREE.DirectionalLight(0xfff2d0, 1.05); key.position.set(1.2, 2.0, 3.0); scene.add(key);
    var rim = new THREE.DirectionalLight(0x86e9ff, 0.45); rim.position.set(-2.0, -0.6, 1.6); scene.add(rim);

    // --- eser düzlemi
    var loader = new THREE.TextureLoader();
    var artTex = loader.load(CFG.artUrl);
    artTex.encoding = THREE.sRGBEncoding;
    artMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(W, H),
      new THREE.MeshBasicMaterial({ map: artTex })
    );
    scene.add(artMesh);

    // --- yeşillenme katmanı (eserden geniş; etraf da yeşillensin)
    maskTex = maskTexture();
    greenMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(W * 1.7, H * 1.28),
      new THREE.MeshBasicMaterial({
        color: 0x3fd587, alphaMap: maskTex, transparent: true,
        blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.62
      })
    );
    greenMesh.position.z = 0.014;
    scene.add(greenMesh);

    // --- filizler (tek draw call)
    var leafMat = new THREE.MeshBasicMaterial({ map: leafTexture(), transparent: true, depthWrite: false });
    sprouts = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1), leafMat, CFG.SPROUT_MAX);
    sprouts.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    sprouts.count = 0;
    sprouts.frustumCulled = false;
    scene.add(sprouts);

    // --- polen
    var pos = new Float32Array(CFG.POLLEN_MAX * 3);
    for (var i = 0; i < CFG.POLLEN_MAX; i++) {
      pos[i * 3] = 0; pos[i * 3 + 1] = 0; pos[i * 3 + 2] = -999;
      pollenPool.push({ p: new THREE.Vector3(), v: new THREE.Vector3(), life: 0, max: 1, alive: false });
    }
    pollenGeo = new THREE.BufferGeometry();
    pollenAttr = new THREE.BufferAttribute(pos, 3);
    pollenAttr.setUsage(THREE.DynamicDrawUsage);
    pollenGeo.setAttribute('position', pollenAttr);
    pollen = new THREE.Points(pollenGeo, new THREE.PointsMaterial({
      map: dotTexture(), size: 0.062, sizeAttenuation: true, transparent: true,
      blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.95
    }));
    pollen.frustumCulled = false;
    scene.add(pollen);

    onResize();
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', function () { setTimeout(onResize, 350); });
  }

  function onResize() {
    var wrap = $('canvasWrap');
    var w = wrap.clientWidth, h = wrap.clientHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    var half = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);
    var dH = (H / 2) / half;
    var dW = (W / 2) / (half * camera.aspect);
    camera.position.set(0, 0, Math.max(dH, dW) * 1.07);
    camera.updateProjectionMatrix();
  }

  /* ------------------------------------------------------------ arı kurma */

  function makeBeeMaterial(src) {
    var m = src.clone();
    m.emissiveIntensity = 0.95;
    m.side = THREE.DoubleSide;
    m.userData.flap = { value: 0 };
    m.onBeforeCompile = function (shader) {
      shader.uniforms.uFlap = m.userData.flap;
      shader.vertexShader =
        'uniform float uFlap;\n' + shader.vertexShader.replace(
          '#include <begin_vertex>',
          '#include <begin_vertex>\n' +
          '  float wm = smoothstep(0.46, 0.92, abs(transformed.x));\n' +
          '  if (wm > 0.001) {\n' +
          '    float ang = uFlap * wm * sign(transformed.x);\n' +
          '    float cw = cos(ang), sw = sin(ang);\n' +
          '    float nx = transformed.x * cw - transformed.y * sw;\n' +
          '    float ny = transformed.x * sw + transformed.y * cw;\n' +
          '    transformed.x = nx; transformed.y = ny;\n' +
          '  }\n'
        );
    };
    m.customProgramCacheKey = function () { return 'a01-bee-flap'; };
    return m;
  }

  function spawnBees(n) {
    // eski arıları temizle
    bees.forEach(function (b) { scene.remove(b.obj); });
    bees = [];

    var order = FLOWERS.map(function (f, i) { return i; });
    for (var s = order.length - 1; s > 0; s--) { var r = (Math.random() * (s + 1)) | 0; var tmp = order[s]; order[s] = order[r]; order[r] = tmp; }

    for (var i = 0; i < n; i++) {
      var group = new THREE.Group();
      var pivot = new THREE.Group();
      // Model zaten doğru yönde: yüz = +Z, üst = +Y, kanat açıklığı = ±X.
      // Object3D.lookAt() yerel +Z'yi hedefe çevirdiği için ek döndürme gerekmez.
      var mesh = beeProto.clone(true);
      var mat = makeBeeMaterial(beeProto.material);
      mesh.traverse(function (o) { if (o.isMesh) o.material = mat; });
      pivot.add(mesh);
      group.add(pivot);

      var sc = 0.108 + Math.random() * 0.026;
      group.scale.setScalar(sc);

      // ekran dışından giriş noktası
      var side = i % 4;
      var sx = (side === 0 ? -1 : side === 1 ? 1 : (Math.random() < 0.5 ? -1 : 1)) * (W * 0.95 + Math.random() * 0.8);
      var sy = (side === 2 ? 1 : side === 3 ? -1 : (Math.random() * 2 - 1)) * (H * 0.62 + Math.random() * 0.5);
      group.position.set(sx, sy, 0.9 + Math.random() * 1.4);
      scene.add(group);

      bees.push({
        obj: group, pivot: pivot, mat: mat,
        pos: group.position,
        vel: new THREE.Vector3((sx > 0 ? -1 : 1) * 0.5, 0, -0.2),
        quat: new THREE.Quaternion(),
        state: 'wait', t: 0, delay: i * 0.42 + Math.random() * 0.25,
        flower: order[i % order.length], visits: 0, legs: 0,
        wander: new THREE.Vector3(), flapAmp: 1, phase: Math.random() * 10,
        emit: 0, emitRate: 0, bank: 0
      });
    }
  }

  function flowerPos(i) {
    var f = FLOWERS[i];
    return new THREE.Vector3((f[0] - 0.5) * W, (0.5 - f[1]) * H, 0.035);
  }

  function newWander(b) {
    b.wander.set(
      (Math.random() - 0.5) * W * 1.35,
      (Math.random() - 0.5) * H * 1.05,
      0.28 + Math.random() * 0.95
    );
  }

  /* ------------------------------------------------------- polen & filiz  */

  var _tmpV = null, _tmpM = null, _tmpQ = null, _tmpS = null;
  var _oF = null, _oU = null, _oZero = null, _oM = null, _oQ = null;
  var _WORLD_UP = null, _FACE_CAM = null, _sScale = null;

  function emitPollen(b) {
    for (var i = 0; i < pollenPool.length; i++) {
      var p = pollenPool[i];
      if (p.alive) continue;
      var back = _tmpV.set(0, 0, 1).applyQuaternion(b.obj.quaternion).multiplyScalar(0.11);
      p.p.copy(b.pos).add(back);
      p.v.set((Math.random() - 0.5) * 0.55, (Math.random() - 0.5) * 0.35 - 0.12, -(0.35 + Math.random() * 0.55));
      p.life = 0; p.max = 1.3 + Math.random() * 1.9; p.alive = true;
      return;
    }
  }

  function addSprout(x, y) {
    // 1) yeşillenme maskesine boya
    var u = (x / (W * 1.7) + 0.5) * maskCtx.canvas.width;
    var v = (0.5 - y / (H * 1.28)) * maskCtx.canvas.height;
    var rr = 26 + Math.random() * 22;
    var g = maskCtx.createRadialGradient(u, v, 0, u, v, rr);
    g.addColorStop(0, 'rgba(255,255,255,0.26)');
    g.addColorStop(0.5, 'rgba(255,255,255,0.09)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    maskCtx.globalCompositeOperation = 'lighter';
    maskCtx.fillStyle = g;
    maskCtx.fillRect(u - rr, v - rr, rr * 2, rr * 2);
    maskTex.needsUpdate = true;

    // 2) filiz
    var s = { x: x, y: y, target: 0.10 + Math.random() * 0.10, g: 0, rot: (Math.random() - 0.5) * 0.5, ph: Math.random() * 9 };
    if (sproutList.length < CFG.SPROUT_MAX) { s.idx = sproutList.length; sproutList.push(s); sprouts.count = sproutList.length; }
    else { s.idx = (landedCount % CFG.SPROUT_MAX); sproutList[s.idx] = s; }

    landedCount++;
    greenProgress = Math.min(1, landedCount / CFG.GREEN_FULL);
    $('pct').textContent = '%' + Math.round(greenProgress * 100);
  }

  /* ------------------------------------------------------------ animasyon */

  // Matrix4.lookAt(eye, target, up) -> z sütunu = normalize(eye - target).
  // Nesnenin +Z'sinin 'forward' olmasını istiyoruz: eye = forward, target = sıfır.
  function orient(b, forward, up, dt, rate) {
    _oF.copy(forward); _oU.copy(up); _oZero.set(0, 0, 0);
    if (_oF.lengthSq() < 1e-9) return;
    _oM.lookAt(_oF, _oZero, _oU);
    _oQ.setFromRotationMatrix(_oM);
    b.obj.quaternion.slerp(_oQ, Math.min(1, dt * rate));
  }

  function updateBee(b, dt, time) {
    var target = null, maxSpeed = 1.5, accel = 2.6;
    var landed = false;

    switch (b.state) {
      case 'wait':
        b.delay -= dt;
        if (b.delay <= 0) { b.state = 'approach'; }
        return;

      case 'approach': {
        var fp = flowerPos(b.flower);
        target = fp.clone().add(new THREE.Vector3(
          Math.sin(time * 1.6 + b.phase) * 0.16,
          0.20 + Math.cos(time * 1.9 + b.phase) * 0.10,
          0.34 + Math.sin(time * 1.2 + b.phase) * 0.10
        ));
        maxSpeed = 1.75; accel = 2.4;
        if (b.pos.distanceTo(target) < 0.22) { b.state = 'land'; b.t = 0; b.landFrom = b.pos.clone(); }
        break;
      }

      case 'land': {
        b.t += dt / 0.95;
        var k = Math.min(1, b.t); k = 1 - Math.pow(1 - k, 3);
        var fp2 = flowerPos(b.flower);
        b.pos.lerpVectors(b.landFrom, fp2, k);
        b.flapAmp += (0.18 - b.flapAmp) * Math.min(1, dt * 3);
        _tmpV.set(Math.sin(b.phase) * 0.30, Math.cos(b.phase) * 0.16, 1).normalize();
        orient(b, _tmpV, _WORLD_UP, dt, 4.5);
        if (b.t >= 1) { b.state = 'feed'; b.t = 1.9 + Math.random() * 1.9; b.visits++; }
        return;
      }

      case 'feed': {
        b.t -= dt;
        var fp3 = flowerPos(b.flower);
        b.pos.set(fp3.x + Math.sin(time * 5 + b.phase) * 0.006,
                  fp3.y + Math.cos(time * 6.5 + b.phase) * 0.006, fp3.z);
        b.flapAmp += (0.16 - b.flapAmp) * Math.min(1, dt * 3);
        _tmpV.set(Math.sin(b.phase + time * 0.6) * 0.34, Math.cos(b.phase) * 0.16, 1).normalize();
        orient(b, _tmpV, _WORLD_UP, dt, 2.2);
        if (b.t <= 0) {
          b.state = 'takeoff'; b.t = 0;
          b.takeFrom = b.pos.clone();
          b.emitRate = 18;                     // havalanınca polen saçmaya başla
        }
        return;
      }

      case 'takeoff': {
        b.t += dt / 0.85;
        var k2 = Math.min(1, b.t); var e = k2 * k2;
        var fp4 = flowerPos(b.flower);
        b.pos.set(
          b.takeFrom.x + Math.sin(time * 2 + b.phase) * 0.08 * k2,
          b.takeFrom.y + 0.34 * e,
          fp4.z + 0.62 * e
        );
        b.flapAmp += (1.0 - b.flapAmp) * Math.min(1, dt * 5);
        orient(b, _tmpV.set(Math.sin(b.phase) * 0.3, 0.75, 0.6).normalize(), _WORLD_UP, dt, 3.0);
        if (b.t >= 1) { b.state = 'roam'; b.legs = 0; newWander(b); }
        return;
      }

      case 'roam': {
        target = b.wander;
        maxSpeed = 1.35; accel = 2.0;
        if (b.pos.distanceTo(target) < 0.30) {
          b.legs++;
          if (b.legs >= 3) {
            b.flower = (b.flower + 3 + ((Math.random() * 5) | 0)) % FLOWERS.length;
            b.state = 'approach';
            b.emitRate = 7;                    // çiçeğe giderken daha az polen
          } else { newWander(b); }
        }
        break;
      }
    }

    if (!target) return;

    // yumuşak takip + organik salınım
    var d = target.clone().sub(b.pos);
    var dist = d.length();
    var desired = d.normalize().multiplyScalar(Math.min(maxSpeed, dist * 2.0 + 0.25));
    desired.x += Math.sin(time * 3.1 + b.phase) * 0.22;
    desired.y += Math.cos(time * 2.7 + b.phase * 1.4) * 0.20;
    desired.z += Math.sin(time * 2.2 + b.phase * 0.7) * 0.10;

    var prev = b.vel.clone();
    b.vel.lerp(desired, Math.min(1, accel * dt));
    b.pos.addScaledVector(b.vel, dt);

    b.flapAmp += (1.0 - b.flapAmp) * Math.min(1, dt * 5);

    if (b.vel.lengthSq() > 1e-5) {
      orient(b, _tmpV.copy(b.vel).normalize(), _WORLD_UP, dt, 5.0);
      var turn = b.vel.x - prev.x;
      b.bank += (THREE.MathUtils.clamp(-turn * 2.2, -0.5, 0.5) - b.bank) * Math.min(1, dt * 4);
      b.obj.rotateZ(b.bank);
    }
  }

  function tick() {
    if (!running) return;
    requestAnimationFrame(tick);
    var dt = Math.min(clock.getDelta(), 0.05);
    var time = clock.elapsedTime;

    // --- arılar
    for (var i = 0; i < bees.length; i++) {
      var b = bees[i];
      updateBee(b, dt, time);
      b.mat.userData.flap.value = Math.sin(time * 2 * Math.PI * 13 + b.phase * 6) * 0.52 * b.flapAmp;

      if (b.emitRate > 0) {
        b.emit += dt * b.emitRate;
        while (b.emit >= 1) { b.emit -= 1; emitPollen(b); }
      }
    }

    // --- polen
    var arr = pollenAttr.array;
    for (var k = 0; k < pollenPool.length; k++) {
      var p = pollenPool[k];
      if (!p.alive) { arr[k * 3 + 2] = -999; continue; }
      p.life += dt;
      p.v.y -= 0.30 * dt;                    // hafif yerçekimi
      p.v.multiplyScalar(1 - 0.9 * dt);      // hava sürtünmesi
      p.v.x += Math.sin(time * 2 + k) * 0.10 * dt;
      p.p.addScaledVector(p.v, dt);

      if (p.p.z <= 0.045 || p.life >= p.max) {
        p.alive = false;
        arr[k * 3 + 2] = -999;
        if (Math.abs(p.p.x) < W * 0.85 && Math.abs(p.p.y) < H * 0.64) addSprout(p.p.x, p.p.y);
        continue;
      }
      arr[k * 3] = p.p.x; arr[k * 3 + 1] = p.p.y; arr[k * 3 + 2] = p.p.z;
    }
    pollenAttr.needsUpdate = true;

    // --- filizler
    for (var s = 0; s < sproutList.length; s++) {
      var sp = sproutList[s];
      sp.g += (1 - sp.g) * Math.min(1, dt * 3.2);
      var sway = Math.sin(time * 1.6 + sp.ph) * 0.10 * sp.g;
      var size = sp.target * (0.25 + 0.75 * sp.g);
      _tmpQ.setFromAxisAngle(_tmpS.set(0, 0, 1), sp.rot + sway);
      _tmpM.compose(_tmpV.set(sp.x, sp.y + size * 0.5 * sp.g, 0.028),
                    _tmpQ, _sScale.set(size, size, size));
      sprouts.setMatrixAt(sp.idx, _tmpM);
    }
    if (sproutList.length) sprouts.instanceMatrix.needsUpdate = true;

    // --- ortam yeşillenmesi
    scene.background.setRGB(
      0.031 + greenProgress * 0.02,
      0.094 + greenProgress * 0.20,
      0.122 + greenProgress * 0.06
    );
    greenMesh.material.opacity = 0.30 + greenProgress * 0.42;

    renderer.render(scene, camera);
  }

  /* ------------------------------------------------------------- kontrol  */

  function restart() {
    landedCount = 0; greenProgress = 0;
    $('pct').textContent = '%0';
    maskCtx.globalCompositeOperation = 'source-over';
    maskCtx.fillStyle = '#000';
    maskCtx.fillRect(0, 0, maskCtx.canvas.width, maskCtx.canvas.height);
    maskTex.needsUpdate = true;
    sproutList = []; sprouts.count = 0;
    pollenPool.forEach(function (p) { p.alive = false; });
    spawnBees(CFG.BEE_COUNTS[countIdx]);
  }

  function wireUI() {
    $('btnRestart').addEventListener('click', restart);
    $('btnArt').addEventListener('click', function () {
      artMesh.visible = !artMesh.visible;
      this.textContent = 'Eser: ' + (artMesh.visible ? 'Açık' : 'Kapalı');
      this.classList.toggle('on', artMesh.visible);
    });
    $('btnCount').addEventListener('click', function () {
      countIdx = (countIdx + 1) % CFG.BEE_COUNTS.length;
      this.textContent = CFG.BEE_COUNTS[countIdx] + ' Arı';
      restart();
    });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { running = false; }
      else if (!running) { running = true; clock.getDelta(); tick(); }
    });
  }

  /* ---------------------------------------------------------------- boot  */

  function start() {
    setProgress(0.05, 'three.js yükleniyor…');
    loadScript(CFG.threeUrls, 'three.js', function () {
      THREE = window.THREE;
      if (!THREE) { fail('3B motoru yüklenemedi', 'İnternet bağlantınızı kontrol edip tekrar deneyin.'); return; }

      var cv = document.createElement('canvas');
      if (!(cv.getContext('webgl') || cv.getContext('experimental-webgl'))) {
        fail('Cihaz 3B desteklemiyor', 'Bu tarayıcı WebGL desteklemiyor. iPhone’da Safari, Android’de Chrome deneyin.');
        return;
      }

      _tmpV = new THREE.Vector3(); _tmpS = new THREE.Vector3();
      _tmpM = new THREE.Matrix4(); _tmpQ = new THREE.Quaternion();
      _oF = new THREE.Vector3(); _oU = new THREE.Vector3(); _oZero = new THREE.Vector3();
      _oM = new THREE.Matrix4(); _oQ = new THREE.Quaternion();
      _WORLD_UP = new THREE.Vector3(0, 1, 0);
      _FACE_CAM = new THREE.Vector3(0, 0, 1);
      _sScale = new THREE.Vector3();

      setProgress(0.25, 'model yükleyicisi…');
      loadScript(CFG.loaderUrls, 'GLTFLoader', function () {
        setProgress(0.4, 'sahne kuruluyor…');
        try { buildScene(); }
        catch (e) { fail('Sahne kurulamadı', 'Beklenmeyen bir hata oluştu: ' + e.message); return; }

        setProgress(0.5, 'arı modeli indiriliyor…');
        new THREE.GLTFLoader().load(CFG.beeUrl,
          function (gltf) {
            gltf.scene.traverse(function (o) { if (o.isMesh && !beeProto) beeProto = o; });
            if (!beeProto) { fail('Arı modeli okunamadı', 'GLB dosyasında mesh bulunamadı.'); return; }

            setProgress(1, 'hazır');
            clock = new THREE.Clock();
            countIdx = 0;
            spawnBees(CFG.BEE_COUNTS[0]);
            wireUI();
            running = true;
            $('loader').style.display = 'none';
            tick();
          },
          function (ev) {
            if (ev && ev.total) setProgress(0.5 + 0.45 * (ev.loaded / ev.total), 'arı modeli · %' + Math.round(ev.loaded / ev.total * 100));
          },
          function () {
            fail('Arı modeli bulunamadı', 'assets/A01_bee.glb dosyası sunucuda yok. GitHub deposundaki assets klasörüne yüklendiğinden emin olun.');
          }
        );
      }, function () { fail('Model yükleyicisi indirilemedi', 'İnternet bağlantınızı kontrol edip tekrar deneyin.'); });
    }, function () { fail('3B motoru yüklenemedi', 'İnternet bağlantınızı kontrol edip tekrar deneyin.'); });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
